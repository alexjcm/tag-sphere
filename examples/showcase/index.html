<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tag-sphere • Examples Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>tag-sphere</h1>
        <p class="subtitle">One page to compare Vanilla, React and Astro implementations.</p>
      </header>

      <section class="showcase-tools">
        <div class="install-row">
          <div class="install-group">
            <code id="install-command" class="install-code"></code>
            <button id="copy-install" class="copy-btn" type="button" aria-live="polite" aria-label="Copy install command">
              <span class="sr-only">Copy install command</span>
            </button>
          </div>
          <a class="repo-link" href="https://github.com/alexjcm/tag-sphere" target="_blank" rel="noopener noreferrer">
            <svg class="repo-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.33c-2.24.49-2.71-1.08-2.71-1.08-.36-.93-.9-1.17-.9-1.17-.73-.5.06-.49.06-.49.81.06 1.24.84 1.24.84.72 1.24 1.9.88 2.36.67.07-.52.28-.88.5-1.08-1.79-.2-3.67-.9-3.67-4.02 0-.89.32-1.62.83-2.18-.08-.2-.36-1.02.08-2.12 0 0 .68-.22 2.22.83a7.7 7.7 0 0 1 4.04 0c1.54-1.05 2.22-.83 2.22-.83.44 1.1.16 1.92.08 2.12.52.56.83 1.29.83 2.18 0 3.13-1.88 3.81-3.68 4.01.29.25.55.74.55 1.5l-.01 2.22c0 .21.15.46.55.38A8 8 0 0 0 8 0"></path>
            </svg>
            GitHub
          </a>
        </div>
      </section>

      <section class="tabs" role="tablist" aria-label="Examples tabs">
        <button id="tab-vanilla" class="tab is-active" data-target="vanilla" role="tab" aria-controls="viewer-panel" aria-selected="true" tabindex="0" type="button">Vanilla</button>
        <button id="tab-react" class="tab" data-target="react" role="tab" aria-controls="viewer-panel" aria-selected="false" tabindex="-1" type="button">React</button>
        <button id="tab-astro" class="tab" data-target="astro" role="tab" aria-controls="viewer-panel" aria-selected="false" tabindex="-1" type="button">Astro</button>
      </section>

      <section id="viewer-panel" class="viewer-wrap" role="tabpanel" aria-labelledby="tab-vanilla">
        <div class="meta">
          <h2 id="title">Vanilla Demo</h2>
          <a id="open-link" href="./vanilla/" target="_blank" rel="noopener noreferrer">Open in new tab</a>
        </div>
        <iframe
          id="viewer"
          class="viewer"
          title="tag-sphere demo viewer"
          src="./vanilla/"
          allow="clipboard-write; clipboard-read"
        ></iframe>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
