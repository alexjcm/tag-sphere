<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tag-sphere • Vanilla Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <div id="sphere" class="sphere"></div>

        <div class="controls">
          <label>Radius <input id="radius" type="range" min="60" max="200" step="5" value="120" /></label>
          <label>Speed <input id="speed" type="range" min="0.001" max="0.08" step="0.001" value="0.01" /></label>
          <label>Direction <input id="direction" type="range" min="0" max="359" step="1" value="20" /></label>
          <p class="values" id="values"></p>
        </div>
      </section>

      <section class="resource-grid">
        <article class="resource-card">
          <div class="snippet-head">
            <h2>Minimal Example</h2>
            <button id="copy-snippet" class="copy-btn" type="button" aria-live="polite" aria-label="Copy code">
              <span class="sr-only">Copy snippet</span>
            </button>
          </div>
          <pre class="code-block"><code id="snippet-code"></code></pre>
        </article>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
