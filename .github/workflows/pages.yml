name: Deploy Showcase to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install root dependencies
        run: npm ci

      - name: Sync examples package version
        run: npm run examples:sync-version

      - name: Install examples dependencies
        run: npm --prefix examples install

      - name: Verify installed tag-sphere version in examples
        run: npm --prefix examples ls tag-sphere

      - name: Build examples showcase
        run: npm --prefix examples run build

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
